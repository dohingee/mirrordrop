# Tests, checks, signs and uploads the iOS app (app + broadcast extension) to TestFlight in one job
# on one macOS runner (one queue wait, one package restore). Start it from the PC by pushing a tag
# testflight-<anything> on the commit to ship, or from the Actions tab. Setup (Apple Developer,
# App Store Connect API key, GitHub secrets): docs/SETUP.md.
# Time: about 10-15 min when a passed "iOS build" run is reused, about 25-30 otherwise (free: the
# repository is public; the team ID is masked in the logs, keys are secrets).
#  1. Unit tests and 2. launch check (same scripts as ios-build.yml), unless a passed "iOS build"
#     run already did both for this commit (or an ancestor with no app change since) under the same
#     Xcode: .github/scripts/find-launch-check.py. Never uploads without both. A test failure stops
#     the job before the launch check and the archive.
#  3. Archive (Release, device) and upload. Build number = this workflow's run number, written to
#     the app and the extension (CURRENT_PROJECT_VERSION) and checked in both.
# The builds differ in configuration or platform, so none can reuse another's compiled output; what
# they share is the runner, the selected Xcode, the generated project and the Swift packages.
name: iOS TestFlight

on:
  push:
    tags: ["testflight-*"]
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner (arm64 is the default: the Intel runner kept stalling on simulator boots, TestFlight #8/#9; if one waits too long or stalls, try the other)"
        type: choice
        options: [macos-26, macos-26-intel]
        default: macos-26
      force_launch_check:
        description: "Run the unit tests and the launch check even if iOS build already passed them for this commit"
        type: boolean
        default: false

permissions:
  # write: only to publish launch-check results to the ci-results branch (publish-ci-results.sh).
  contents: write
  # Reads earlier "iOS build" runs (.github/scripts/find-launch-check.py).
  actions: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 60
    env:
      RESULTS_DIR: ${{ github.workspace }}/ios/build/ci-results
    steps:
      # First step: a missing secret fails in seconds instead of after the build.
      - name: Check secrets
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY: ${{ secrets.ASC_KEY_P8 }}
          TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: |
          # Public repository, public logs: the team ID is a variable, not a secret, so mask it here
          # for every later step of this job (DEVELOPMENT_TEAM, ExportOptions).
          [ -z "$TEAM" ] || echo "::add-mask::$TEAM"
          missing=0
          for name in KEY_ID:ASC_KEY_ID ISSUER:ASC_ISSUER_ID KEY:ASC_KEY_P8 TEAM:APPLE_TEAM_ID; do
            var="${name%%:*}"
            if [ -z "${!var}" ]; then echo "::error::GitHub secret or variable ${name#*:} is not set (docs/SETUP.md 5)"; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@v7

      - name: Xcode, XcodeGen and Swift packages
        id: setup
        uses: ./.github/actions/ios-setup

      # Never upload a build that fails its tests or does not start. A passed "iOS build" run of the
      # same app content and Xcode counts; without one, or if the lookup fails, both run here.
      - name: Find a passed iOS build (tests + launch check) of this commit
        id: earlier
        if: ${{ !inputs.force_launch_check }}
        env:
          GH_TOKEN: ${{ github.token }}
          XCODE: ${{ steps.setup.outputs.xcode }}
        run: python3 .github/scripts/find-launch-check.py

      - name: Unit tests (simulator)
        id: tests
        if: steps.earlier.outputs.run_url == ''
        working-directory: ios
        run: bash ../.github/scripts/ios-unit-tests.sh

      - name: Launch check (iPhone and iPad simulators)
        if: steps.earlier.outputs.run_url == ''
        working-directory: ios
        timeout-minutes: 35
        run: bash ../.github/scripts/ios-launch-check.sh

      # Screenshots of what is about to ship (or why it stopped), readable from the PC. Skipped
      # when an earlier "iOS build" run was reused: that run already published them.
      - name: Publish results to the ci-results branch
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/publish-ci-results.sh launch-check "$RESULTS_DIR"

      - name: Archive and upload
        working-directory: ios
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY: ${{ secrets.ASC_KEY_P8 }}
          TEAM: ${{ vars.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          key="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$KEY" > "$key"
          # Each run would otherwise leave one more development certificate behind (account limit).
          KEY_PATH="$key" python3 -u ../.github/scripts/asc-clean-dev-certs.py < /dev/null || echo "::warning::could not revoke old development certificates (docs/SETUP.md)"
          # Automatic signing registers both bundle IDs (com.mirrordrop.app and .broadcast) with the
          # App Group and makes their profiles on the first run.
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          xcodebuild archive \
            -project MirrorDrop.xcodeproj -scheme MirrorDrop -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/MirrorDrop.xcarchive \
            -clonedSourcePackagesDirPath "$SPM_PACKAGES_DIR" -disablePackageRepositoryCache \
            -skipPackagePluginValidation -skipMacroValidation \
            "${auth[@]}" DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" 2>&1 | tee ../xcodebuild-output.txt | grep -E "error:|\*\* " || true
          grep -q '\*\* ARCHIVE SUCCEEDED \*\*' ../xcodebuild-output.txt
          app=build/MirrorDrop.xcarchive/Products/Applications/MirrorDrop.app
          for plist in "$app/Info.plist" "$app/PlugIns/MirrorDropBroadcast.appex/Info.plist"; do
            if [ ! -f "$plist" ]; then echo "::error::missing $plist (extension not embedded?)"; exit 1; fi
            built=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")
            if [ "$built" != "$BUILD_NUMBER" ]; then echo "::error::$plist has build number $built, expected $BUILD_NUMBER"; exit 1; fi
          done
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/MirrorDrop.xcarchive -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist "${auth[@]}" 2>&1 | tee -a ../xcodebuild-output.txt | grep -E "error:|Upload|\*\* " || true
          grep -q '\*\* EXPORT SUCCEEDED \*\*' ../xcodebuild-output.txt
          rm -f "$key"
          echo "Uploaded build $BUILD_NUMBER to App Store Connect. It appears in TestFlight after processing (5-30 min)." >> "$GITHUB_STEP_SUMMARY"

      - name: Report build errors
        if: failure()
        run: |
          for f in xcodebuild-output.txt ios/build/launch-build.txt; do
            [ -f "$f" ] || continue
            grep -E "error:|failed|XCTAssert|No profiles|No Accounts|not have permission|App Group" "$f" | tail -n 20 | cut -c1-400 | sed -E 's/%/%25/g' \
              | while IFS= read -r line; do echo "::error title=$(basename "$f")::${line}"; done
          done
