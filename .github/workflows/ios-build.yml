# Checks an iOS change without uploading it: unit tests, then the launch check, on one macOS runner
# (one queue wait, one package restore). About 25-30 min per run. The repository is public (free
# Actions minutes), but a branch push still never starts it, to keep runs deliberate: start it on purpose when a commit needs checking or screenshots, from the PC by pushing
# a tag ios-check-<anything> on that commit (no gh CLI needed), or Actions > iOS build > Run
# workflow. Same-repository pull requests that touch the app run it too. iOS TestFlight (tag
# testflight-*) runs the same scripts itself unless this already passed.
#  1. Unit tests: Debug build of the MirrorDropTests scheme for the simulator, unsigned, no secrets
#     (.github/scripts/ios-unit-tests.sh).
#  2. Launch check: Release app for the simulator with its entitlements (ad-hoc signed), extension
#     embedded and build numbers equal, started on iPhone and iPad simulators, with screenshots of
#     each screen (.github/scripts/ios-launch-check.sh). Runs even when a unit test failed, so one
#     run reports both; a run with a failed test is not "success", so TestFlight never reuses it.
#  3. The results (screenshots, summary, crash reports) are pushed to the ci-results branch, so they
#     can be read from the PC with git alone (.github/scripts/publish-ci-results.sh).
# iOS TestFlight reuses a passed tag or manual run of the same app content and Xcode instead of repeating
# 1 and 2 (.github/scripts/find-launch-check.py matches the launch step's name below: keep in sync).
name: iOS build

on:
  # Tags only, never branches (see above).
  push:
    tags: ["ios-check-*"]
  # Keep these paths in sync with APP_PATHS and NOT_APP_PATHS in find-launch-check.py.
  pull_request:
    paths:
      - "ios/**"
      - "!ios/fastlane/**"
      - ".github/actions/ios-setup/**"
      - ".github/scripts/ios-unit-tests.sh"
      - ".github/scripts/ios-launch-check.sh"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-26 (arm64, Apple silicon). The Intel runner stalled booting simulators again and again
    # (iOS TestFlight #8 and #9, 2026-11-19). The arm64 queue sometimes gives up ("not acquired by
    # Runner", GitHub capacity: 2026-11-18 and TestFlight #12); then run again or pick macos-26-intel.
    runs-on: macos-26
    timeout-minutes: 50
    # Public repository: pull requests from forks never run here (they are not ours to check).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Only to push the results to the ci-results branch (publish-ci-results.sh touches no other branch).
    permissions:
      contents: write
    env:
      RESULTS_DIR: ${{ github.workspace }}/ios/build/ci-results
    steps:
      - uses: actions/checkout@v7

      - name: Xcode, XcodeGen and Swift packages
        id: setup
        uses: ./.github/actions/ios-setup

      - name: Build and test (simulator)
        working-directory: ios
        run: bash ../.github/scripts/ios-unit-tests.sh

      - name: Launch on iPhone and iPad simulators (Xcode ${{ steps.setup.outputs.xcode }})
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: ios
        timeout-minutes: 40
        run: bash ../.github/scripts/ios-launch-check.sh

      # Fork pull requests never get here (job condition); kept as a second guard.
      - name: Publish results to the ci-results branch
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/publish-ci-results.sh launch-check "$RESULTS_DIR"

      # Unit test log and launch-check build log (the launch check's own failures are annotations already).
      - name: Report build errors
        if: failure()
        run: |
          for f in xcodebuild-output.txt ios/build/launch-build.txt; do
            [ -f "$f" ] || continue
            grep -E "error:|failed|XCTAssert" "$f" | tail -n 20 | cut -c1-400 | sed -E 's/%/%25/g' \
              | while IFS= read -r line; do echo "::error title=$(basename "$f")::${line}"; done
          done
